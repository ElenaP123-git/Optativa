<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio de prueba JS</title>
</head>
<body>
    <script>
        var numero = prompt("Introduce un número:");

        // Tabla de multiplicar del primer número
        for(var i = 0; i <= 10; i++) {
            var resultado = numero * i;
            document.write("<p>" + numero + " x " + i + " = " + resultado + "</p>");
        }

        var numero2 = prompt("Introduce otro número:");
        
        //Tabla de multiplicar del segundo número
        while (i <= 10) {
            var resultado2 = numero2 * i;
            document.write("<p>" + numero2 + " x " + i + " = " + resultado2 + "</p>");
            i++;
            
        }

    </script>
</body>
</html>
