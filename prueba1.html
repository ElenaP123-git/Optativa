<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio de prueba JS</title>
</head>
<body>

    <script>
        // Pedir los datos por teclado y guardarlos en variables
        var nombre = prompt("Introduce tu nombre:");
        var sueldo = prompt("Introduce tu sueldo:");

        // Cálculo del sueldo con 15% de retención
        var sueldoNeto = sueldo * 0.85;

        // Mostrar alerta en consola
        alert("Hola " + nombre + ", tu sueldo neto es: " + sueldoNeto + "€");

        // Etiqueta H1
        document.write("<h1>Hola " + nombre + "</h1>");
    </script>

</body>
</html>
